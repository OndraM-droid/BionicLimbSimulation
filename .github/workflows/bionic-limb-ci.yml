name: bionic-limb-threejs CI

on:
  push:
    branches: ['agents/plan-review-and-development']
    paths: ['bionic-limb-threejs/**']
  pull_request:
    paths: ['bionic-limb-threejs/**']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bionic-limb-threejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bionic-limb-threejs/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
